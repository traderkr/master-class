<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Class</title><link rel="stylesheet" href="style.css?v=5">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script></head><body>
<header><h1>Master Class</h1><nav id="tabs">
<button data-tab="ret" class="on">Retirement</button><button data-tab="notes">Notes</button></nav></header>
<main>
<section id="ret" class="tab on">
 <p class="sub" id="ret-sub"></p><div class="kpis" id="ret-kpis"></div>
 <div class="card"><h2>Holdings</h2><div class="scroll"><table id="ret-hold"></table></div></div>
 <div class="grid2"><div class="card"><h2>Allocation</h2><canvas id="c-alloc"></canvas></div>
 <div class="card"><h2>Sector exposure</h2><canvas id="c-sector"></canvas></div></div>
 <div class="card"><h2>Top stock exposure (look-through)</h2><div class="tall"><canvas id="c-stocks"></canvas></div><p class="note" id="ret-cav"></p>
 <details><summary>Full look-through table</summary><div class="scroll"><table id="ret-look"></table></div></details></div>
 <div class="card"><h2>Cash</h2><table id="ret-cash"></table></div>
 <div class="card"><h2>Trade log</h2><div id="ret-trades"></div></div>
</section>
<section id="notes" class="tab"><p class="sub" id="n-sub"></p>
 <div class="card"><h2>Watchlist &amp; ideas</h2><div class="grid2" id="n-watch"></div>
 <h3>Fund watchlist</h3><div class="scroll"><table id="n-funds"></table></div><p class="note" id="n-fasof"></p></div>
</section>
</main>
<script src="app.js?v=5"></script></body></html>
