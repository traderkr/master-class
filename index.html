async function open_(key,save){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(C.v)},key,d(C.c));if(save){const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));localStorage.setItem('mc_k',raw)}
const h=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()}
