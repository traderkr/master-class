const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),e=document.getElementById('e');
async function open_(key,save){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(C.v)},key,d(C.c));if(save){const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));localStorage.setItem('mc_k',raw)}
const h=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()}
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();e.textContent='Unlocking…';try{const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(C.s),iterations:C.i,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt']);await open_(key,document.getElementById('r').checked)}catch(x){e.textContent='Incorrect password.'}};
(async()=>{const s=localStorage.getItem('mc_k');if(s){try{await open_(await crypto.subtle.importKey('raw',d(s),'AES-GCM',true,['decrypt']))}catch(x){localStorage.removeItem('mc_k')}}})();
